<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTEA Help Desk - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body centered">
    <main class="login-centered-container">
        <section class="login-panel" aria-labelledby="loginTitle">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <div class="login-logo" aria-hidden="true"><i class="ph-bold ph-buildings"></i></div>
                    <p class="login-institution">Universidad Tecnológica de los Andes</p>
                    <h1 id="loginTitle">UTEA Help Desk</h1>
                    <p>Acceso al portal de soporte institucional</p>
                </div>

                <div class="login-mode-switch" role="group" aria-label="Tipo de acceso">
                    <button type="button" id="showLogin" class="login-mode-button active" aria-pressed="true">Iniciar sesión</button>
                    <button type="button" id="showRegister" class="login-mode-button" aria-pressed="false">Crear cuenta</button>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" placeholder="ej. anthony" required autocomplete="off">
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-login">Ingresar <i class="ph-bold ph-arrow-right"></i></button>
                </form>

                <form id="registerForm" class="login-form" style="display:none;">
                    <div class="input-group">
                        <label for="registerUsername">Usuario</label>
                        <input type="text" id="registerUsername" placeholder="ej. anthony" required autocomplete="off">
                    </div>
                    
                    <div class="input-group">
                        <label for="registerPassword">Contraseña</label>
                        <input type="password" id="registerPassword" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label for="registerPasswordConfirm">Confirmar contraseña</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="Repite tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn-login">Crear usuario <i class="ph-bold ph-user-plus"></i></button>
                </form>
                <p id="error" class="error-msg" aria-live="polite"></p>
            </div>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
